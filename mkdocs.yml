site_name: DFIR Handbook
site_description: Personal digital forensics & incident response reference
site_author: Comwhiz

# ── 여기 두 줄만 본인 GitHub 아이디로 바꿔주세요 ──────────────────────────
site_url: https://DFIDwiz-sketch.github.io/dfir-handbook/
repo_url: https://github.com/DFIDwiz-sketch/dfir-handbook
# ─────────────────────────────────────────────────────────────────────────
repo_name: dfir-handbook
edit_uri: edit/main/docs/          # 각 페이지에 ✏️ 편집 버튼 (GitHub 웹에서 바로 수정)

theme:
  name: material
  language: en
  icon:
    logo: material/shield-search
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  favicon: assets/favicon.svg
  # 색은 docs/assets/extra.css 의 --cr-* 값으로 정합니다 (primary/accent: custom).
  # 첫 번째 항목(라이트)이 처음 열었을 때의 기본값 — 해/달 버튼으로 전환.
  palette:
    # 라이트 (기본)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # 다크
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant          # 페이지 전환 빠르게
    - navigation.tracking
    - navigation.tabs             # 상단 탭 = 최상위 폴더
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes          # 폴더의 index.md가 섹션 첫 페이지
    - navigation.top              # 맨 위로 버튼
    - navigation.footer           # 이전/다음 페이지
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy           # 코드 블록 복사 버튼
    - content.code.annotate
    - content.action.edit         # ✏️ 편집 버튼
    - content.action.view
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - awesome-pages                 # 폴더 구조 = 메뉴 (mkdocs.yml nav 편집 불필요)
  - tags                          # 태그 인덱스는 docs/tags.md 의 <!-- material/tags --> 위치에 생성됨
  - glightbox                     # 이미지 클릭하면 확대

markdown_extensions:
  - abbr
  - admonition                    # !!! note / warning / tip 박스
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details              # 접었다 펴는 박스 (??? note)
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys                 # ++ctrl+c++ 키보드 표시
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true       # === "Tab" 탭 UI
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  # 언어 선택 버튼 (상단 🌐 아이콘). 영어가 기본, 한국어는 /ko/ 아래에 따로 빌드됩니다.
  alternate:
    - name: English
      link: /dfir-handbook/
      lang: en
    - name: 한국어
      link: /dfir-handbook/ko/
      lang: ko
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DFIDwiz-sketch
  generator: false

extra_css:
  - assets/extra.css
  - assets/redteam-navigation.css

extra_javascript:
  - assets/lang-switch.js
  - assets/theme.js
  - assets/redteam-navigation.js

copyright: Personal study notes. Not official guidance of any organisation.

dev_addr: 127.0.0.1:8001
