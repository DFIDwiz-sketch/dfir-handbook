# 한국어 사이트 설정 — mkdocs.yml 을 그대로 물려받고, 다른 부분만 덮어씁니다.
# 로컬 미리보기:  mkdocs serve -f mkdocs.ko.yml   →  http://127.0.0.1:8002/dfir-handbook/ko/
INHERIT: mkdocs.yml

site_name: DFIR 핸드북
site_description: 개인 디지털 포렌식·침해사고 대응(DFIR) 레퍼런스
site_url: https://DFIDwiz-sketch.github.io/dfir-handbook/ko/
docs_dir: docs-ko
edit_uri: edit/main/docs-ko/

theme:
  language: ko

plugins:
  - search:
      lang:
        - ko
        - en
  - awesome-pages
  - tags
  - glightbox

copyright: 개인 학습 노트입니다. 어떤 기관의 공식 지침도 아닙니다.

dev_addr: 127.0.0.1:8002
