name: Deploy DFIR Handbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git-revision-date 등 플러그인용

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 영어 사이트 → site/,  한국어 사이트 → site/ko/  를 만든 뒤 한 번에 gh-pages 로 올립니다.
      - run: mkdocs build -d site
      - run: mkdocs build -f mkdocs.ko.yml -d site/ko

      - run: |
          git config user.name  "$GIT_COMMITTER_NAME"
          git config user.email "$GIT_COMMITTER_EMAIL"
          ghp-import --no-jekyll --push --force --branch gh-pages site
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
